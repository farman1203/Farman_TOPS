<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <style>

    </style>
</head>

<body>
    <div class="row p-3  justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center">Cash Calculator</h1>
            <!-- 500 -->
            <div class="row mt-4">
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal">
                    <img src="img/500.jpg" alt="500" width="70%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-2">
                    <input type="number" onkeyup="Calculator()" id="n500" class="form-control border-3 border-primary">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total500">0</span>
                </div>
            </div>
            <!-- 200 -->
            <div class="row mt-4">
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal">
                    <img src="img/200.jpg" alt="500" width="70%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-2">
                    <input type="number" onkeyup="Calculator()" id="n200" class="form-control border-3 border-primary">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total200">0</span>
                </div>
            </div>
            <!-- 100 -->
            <div class="row mt-4">
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal">
                    <img src="img/100.png" alt="500" width="70%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-2">
                    <input type="number" onkeyup="Calculator()" id="n100" class="form-control border-3 border-primary">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total100">0</span>
                </div>
            </div>
            <!-- 50 -->
            <div class="row mt-4">
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal">
                    <img src="img/50.jpg" onkeyup="Calculator()" alt="500" width="70%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-2">
                    <input type="number" id="n50" class="form-control border-3 border-primary">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total50">0</span>
                </div>
            </div>
            <!-- 20 -->
            <div class="row mt-4">
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal">
                    <img src="img/20.jpg" alt="500" width="70%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-2">
                    <input type="number" onkeyup="Calculator()" id="n20" class="form-control border-3 border-primary">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total20">0</span>
                </div>
            </div>
            <!-- 10 -->
            <div class="row mt-4">
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal">
                    <img src="img/10.jpg" alt="500" width="70%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-2">
                    <input type="number" onkeyup="Calculator()" id="n10" class="form-control border-3 border-primary">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total10">0</span>
                </div>
            </div>
            <!-- 5 -->
            <div class="row mt-4">
                <div class="col-xl-4 col-md-4 cash-nirmal">
                    <img src="img/5.jpg" alt="500" width="70%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4 cash-nirmal p-2">
                    <input type="number" onkeyup="Calculator()" id="n5" class="form-control border-3 border-primary">
                </div>
                <div class="col-xl-4 col-md-4  cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total5">0</span>
                </div>
            </div>
            <!-- 2 -->
            <div class="row mt-4">
                <div class="col-xl-4 col-md-4  cash-nirmal">
                    <img src="img/2.jpg" alt="500" width="70%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4  cash-nirmal p-2">
                    <input type="number" onkeyup="Calculator()" id="n2" class="form-control border-3 border-primary">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total2">0</span>
                </div>
            </div>
            <!-- 1 -->
            <div class="row mt-4">
                <div class="col-md-4 cash-nirmal">
                    <img src="img/1.jpg" alt="500" width="60%" class="img-fluid img-currency">
                </div>
                <div class="col-xl-4 col-md-4 col-4 col-sm-4 col-lg-4 cash-nirmal p-2">
                    <input type="number" onkeyup="Calculator()" id="n1" class="form-control border-3 border-primary">
                </div>
                <div class="col-md-4 cash-nirmal p-3">
                    <span class="alert alert-success ">⚌</span> &nbsp;<span class="alert alert-primary"
                        id="total1">0</span>
                </div>
            </div>

            <h2 id="gtotals" class="text-success" onchange="Calculator()"> Grand Total is: </h2>
            <h2 id="ntotal" class="text-primary" onchange="Calculator()">Total Note is: </h2>
        </div>



    </div>
    <script>
        function Calculator() {
            var note500 = document.getElementById('n500').value || 0;
            var note200 = document.getElementById('n200').value || 0;
            var note100 = document.getElementById('n100').value || 0;
            var note50 = document.getElementById('n50').value || 0;
            var note20 = document.getElementById('n20').value || 0;
            var note10 = document.getElementById('n10').value || 0;
            var note5 = document.getElementById('n5').value || 0;
            var note2 = document.getElementById('n2').value || 0;
            var note1 = document.getElementById('n1').value || 0;

            var t500 = note500 * 500;
            var t200 = note200 * 200;
            var t100 = note100 * 100;
            var t50 = note50 * 50;
            var t20 = note20 * 20;
            var t10 = note10 * 10;
            var t5 = note5 * 5;
            var t2 = note2 * 2;
            var t1 = note1 * 1;


            document.getElementById("total500").innerText = t500;
            document.getElementById("total200").innerText = t200;
            document.getElementById("total100").innerText = t100;
            document.getElementById("total50").innerText = t50;
            document.getElementById("total20").innerText = t20;
            document.getElementById("total10").innerText = t10;
            document.getElementById("total5").innerText = t5;
            document.getElementById("total2").innerText = t2;
            document.getElementById("total1").innerText = t1;


            var gtotal = t500 + t200 + t100 + t50 + t20 + t10 + t5 + t2 + t1;
            document.getElementById('gtotals').innerText= "Grand Total is:"  +gtotal;

            var note1= note500 * 1;
            var note2= note200 * 1;
            var note3= note100 * 1;
            var note4= note50 * 1;
            var note5= note20 * 1;
            var note6= note10 * 1;
            var note7= note5 * 1;
            var note8= note2 * 1;
            var note9= note1 * 1;

            var ntotal = note1+ note2 +note3+ note4+note5+note6+note7+note8+note9;
            document.getElementById('ntotal').innerText="Total Note is:" +ntotal;

        } 
    </script>
</body>

</html>
