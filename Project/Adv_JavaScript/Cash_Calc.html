<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Calculator </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
        }

        .cash-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 90%;
            max-width: 650px;
            color: #fff;
        }

        h1 {
            text-align: center;
            font-weight: 700;
            color: #fff;
            text-shadow: 1px 2px 3px rgba(0, 0, 0, 0.3);
        }

        .note-row {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            margin-top: 15px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        input {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .result {
            text-align: center;
            margin-top: 25px;
        }

        .result h2 {
            font-weight: 600;
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
        }

        #gtotals {
            background: #28a745;
        }

        #ntotal {
            background: #007bff;
        }

        .currency-value {
            font-size: 1.2rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="cash-card">
        <h1>Cash Calculator</h1>

        <!-- Currency Rows -->
        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/500.jpg" width="80%"></div>
            <div class="col-4"><input type="number" id="n500" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total500">0</div>
        </div>

        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/200.jpg" width="80%"></div>
            <div class="col-4"><input type="number" id="n200" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total200">0</div>
        </div>

        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/100.png" width="80%"></div>
            <div class="col-4"><input type="number" id="n100" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total100">0</div>
        </div>

        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/50.jpg" width="80%"></div>
            <div class="col-4"><input type="number" id="n50" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total50">0</div>
        </div>

        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/20.jpg" width="80%"></div>
            <div class="col-4"><input type="number" id="n20" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total20">0</div>
        </div>

        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/10.jpg" width="80%"></div>
            <div class="col-4"><input type="number" id="n10" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total10">0</div>
        </div>

        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/5.jpg" width="80%"></div>
            <div class="col-4"><input type="number" id="n5" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total5">0</div>
        </div>

        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/2.jpg" width="80%"></div>
            <div class="col-4"><input type="number" id="n2" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total2">0</div>
        </div>

        <div class="note-row row align-items-center">
            <div class="col-4 text-center"><img src="img/1.jpg" width="80%"></div>
            <div class="col-4"><input type="number" id="n1" onkeyup="Calculator()" class="form-control"></div>
            <div class="col-4 text-center currency-value" id="total1">0</div>
        </div>

        <!-- Result -->
        <div class="result">
            <h2 id="gtotals">Grand Total is: 0</h2>
            <h2 id="ntotal">Total Note is: 0</h2>
        </div>
    </div>

    <script>
        function Calculator() {
            let n500 = +document.getElementById('n500').value || 0;
            let n200 = +document.getElementById('n200').value || 0;
            let n100 = +document.getElementById('n100').value || 0;
            let n50 = +document.getElementById('n50').value || 0;
            let n20 = +document.getElementById('n20').value || 0;
            let n10 = +document.getElementById('n10').value || 0;
            let n5 = +document.getElementById('n5').value || 0;
            let n2 = +document.getElementById('n2').value || 0;
            let n1 = +document.getElementById('n1').value || 0;

            document.getElementById("total500").innerText = n500 * 500;
            document.getElementById("total200").innerText = n200 * 200;
            document.getElementById("total100").innerText = n100 * 100;
            document.getElementById("total50").innerText = n50 * 50;
            document.getElementById("total20").innerText = n20 * 20;
            document.getElementById("total10").innerText = n10 * 10;
            document.getElementById("total5").innerText = n5 * 5;
            document.getElementById("total2").innerText = n2 * 2;
            document.getElementById("total1").innerText = n1 * 1;

            let gtotal = (n500 * 500) + (n200 * 200) + (n100 * 100) + (n50 * 50) + (n20 * 20) + (n10 * 10) + (n5 * 5) + (n2 * 2) + (n1 * 1);
            document.getElementById('gtotals').innerText = "Grand Total is: ₹ " + gtotal;

            let ntotal = n500 + n200 + n100 + n50 + n20 + n10 + n5 + n2 + n1;
            document.getElementById('ntotal').innerText = "Total Note is: " + ntotal;
        }
    </script>

</body>
</html>
