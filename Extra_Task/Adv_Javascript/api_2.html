<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" id="data">
        <tr>
            <td>id</td>
            <td>userid</td>
            <td>title</td>
            <td>body</td>
        </tr>
    </table>
    <script>
         // api 2
        fetch('https://jsonplaceholder.typicode.com/posts')
            .then((response) => response.json())
            .then((object) => {
                //console.log(object);
                showdata(object)
            });

            var mydiv=document.getElementById('data')
            function showdata(objarr){
                for (property of objarr){
                    var html=`
                        <tr>
                            <td>${property.id}</td>
                            <td>${property.userId}</td>
                            <td>${property.title}</td>
                            <td>${property.body}</td>
                            </tr>`;
                     mydiv.insertAdjacentHTML('beforeend',html);
                }
            }
    </script>
</body>
</html>
