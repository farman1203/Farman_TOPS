<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
</head>

<body>
  <button onclick="fetchdata()">Show Product</button>
  <button onclick="fetchd()">Show Cart</button>
  <div class="container">
    <div class="row " id="btn">

    </div>
    <div class="row " id="button">

    </div>
  </div>

  <script>
    function fetchdata() {
      fetch(`https://fakestoreapi.com/product`)
        .then((res) => res.json())
        .then((obj) => {
          showdata(obj)

        })
    }

    const btn = document.getElementById("btn");

    function showdata(newdata) {
      for (const mydata of newdata) {
        let html = `<div class="col-md-3 p-2">
			<div class="card">  <img src="${mydata.image}" class="card-img-top" style='height:200px' alt="" />
			  <div class="card-body">
				<h5 class="card-title">${mydata.title}</h5>
				<p class="card-text">${mydata.description.slice(0, 20)}...</p>
				<p class="card-text">Price :${mydata.price} </p>
				<a href="#" class="btn btn-primary">Order Now</a>
			  </div>
			</div>
		  </div>`
        btn.insertAdjacentHTML("afterbegin", html);
      }
    }


    function fetchd() {
      fetch(`https://fakestoreapi.com/carts`)
        .then(response => response.json())
        .then(obj => {
          show(obj)

        })
    }


    let button = document.getElementById('button');
    function show(data) {
      for (const dt of data) {
        const htmldata = `<div class="col-md-3 p-2">
          <div class="card">
			  <div class="card-body">
				<h5 class="card-title">${dt.id}</h5>
				<p class="card-text">${dt.userId}...</p>
				<p class="card-text">Price :${dt.description} </p>
       <img src="${dt.image}" class="card-img-top" style='height:200px' alt="" />
				<a href="#" class="btn btn-primary">Order Now</a>
			  </div>
			</div>
		  </div>`

        button.insertAdjacentHTML("afterbegin", htmldata);
      }
    }
  </script>
</body>

</html>
