<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>

<body>

	<script>
		// simple json to object
		let jsonData = `[
						{
							"id": 1,
							"productName": "Apple",
							"Qty": 100
						},
						{
							"id": 2,
							"productName": "Pineapple",
							"Qty": 120
						},
						{
							"id": 3,
							"productName": "Mango",
							"Qty": 10
						}
					]`;

		var myobj = JSON.parse(jsonData);
		console.log(myobj);


		var myjson = JSON.stringify(myobj);
		console.log(myjson);

		// now api(url) to json to object

		fetch('https://jsonplaceholder.typicode.com/posts')
			.then((response) => response.json())
			.then((myobj) => console.log(myobj));


	</script>
</body>

</html>
