<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Date 

        var today=new Date();
        document.write(today +"<br>");

        document.write(today.getDate() +"<br>");

        document.write((today.getDate())  +"/"+  (today.getMonth()) +"/"+ (today.getFullYear()) +"<br>");
        
        document.write((today.getHours())  +":"+  (today.getMinutes()) +":"+ (today.getSeconds()) +"<br>");
        
    </script>

     <!-- Watch -->
    <h1 id="test"> </h1>
    <script>
       setInterval(watch,500)

       function watch(){
        var today=new Date();
        var time=(today.getHours())  +":"+  (today.getMinutes()) +":"+ (today.getSeconds()) +"<br>";
        document.getElementById('test').innerHTML=time;
       }
    </script>
