<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Array : collection similar types of data in single variable
        // non primitive data type

        // primitive : n=10;
        // Array : [56,25,10]

        // array --> 255 values

        let arr=[10,25,20,30,50]

        let i;
        let sum=0;
        for(i=0; i<5;i++ ){
           sum=sum+arr[i];
        }
        document.write("The sum of " + sum);      
    </script>
</body>
</html>
