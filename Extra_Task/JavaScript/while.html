<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="number" id="n1" placeholder="enter number" />

    <button onclick="inc()">increment</button>
    <button onclick="dec()">decrement</button>

    <script>
        function inc() {
            const n1 = document.getElementById('n1').value;
            let i = 1;
            while (i <= n1) {
                console.log(i);
                i++;
            }
        }
        function dec() {
            const n1 = document.getElementById('n1').value;
            let i = n1;
            while (i >= 1) {
                console.log(i);
                i--;
            }
        }
    </script>
</body>

</html>
