<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let result = prompt('enter name')
            .split(" ")
            .map((word, index, arr) =>
                index < arr.length - 1 ? word[0].toUpperCase() + "." : word
            )
            .join(" ");

        console.log(result);
    </script>
</body>

</html>
