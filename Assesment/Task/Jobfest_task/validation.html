<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" onsubmit="return val(this)">
        Enter name: <input type="text" id="name">
        Enter number: <input type="number" id="name1">
        Enter email: <input type="email" id="name2">
        <p id="error"></p>
        <button>submit</button>
    </form>
</body>
<script>
    function val(str) {
        if (str.name.value == "") {
            document.getElementById('error').innerHTML = "plesea enter name";
            return false;
        }

        if (str.name1.value == "") {
            document.getElementById('error').innerHTML = "plesea enter number";
            return false;
        }
        if(str.name1.value.length<8){
            document.getElementById('error').innerHTML = "plesea enter minimum 8 cahr";
            return false;
        }

        if (str.name2.value == "") {
            document.getElementById('error').innerHTML = "please enter email";
            return false;
        }
    }
</script>

</html>
