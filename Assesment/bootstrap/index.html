<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Interaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <h2 class="text-center mb-4">Customer Interaction System</h2>
    
    <!-- Customer Form -->
    <div class="card shadow p-4 mb-4">
      <h4>Add Customer Interaction</h4>
      <form id="customerForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" required>
          <small class="text-danger" id="nameError"></small>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
          <small class="text-danger" id="emailError"></small>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="tel" class="form-control" id="phone" required>
          <small class="text-danger" id="phoneError"></small>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="3" required></textarea>
          <small class="text-danger" id="messageError"></small>
        </div>
        <button type="submit" class="btn btn-primary">Add Interaction</button>
        <button type="reset" class="btn btn-danger"> Reset</button>
      </form>
    </div>

    <!-- Customer List -->
    <div class="card shadow p-4">
      <h4>Customer Records</h4>
      <table class="table table-bordered table-striped mt-3" id="customerTable">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Message</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic Rows Will Appear Here -->
        </tbody>
      </table>
    </div>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("customerForm");
    const tableBody = document.querySelector("#customerTable tbody");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      // Input values
      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let phone = document.getElementById("phone").value.trim();
      let message = document.getElementById("message").value.trim();

      // Error fields
      let nameError = document.getElementById("nameError");
      let emailError = document.getElementById("emailError");
      let phoneError = document.getElementById("phoneError");
      let messageError = document.getElementById("messageError");

      // Reset errors
      nameError.textContent = "";
      emailError.textContent = "";
      phoneError.textContent = "";
      messageError.textContent = "";

      let isValid = true;

      // Validation
      if (name === "") {
        nameError.textContent = "Name is required";
        isValid = false;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailError.textContent = "Invalid email format";
        isValid = false;
      }
      if (!/^\d{10}$/.test(phone)) {
        phoneError.textContent = "Phone must be 10 digits";
        isValid = false;
      }
      if (message === "") {
        messageError.textContent = "Message is required";
        isValid = false;
      }

      if (!isValid) return;

      // Add new row
      let newRow = document.createElement("tr");
      newRow.innerHTML = `
        <td>${name}</td>
        <td>${email}</td>
        <td>${phone}</td>
        <td>${message}</td>
        <td>
          <button class="btn btn-sm btn-warning edit">Edit</button>
          <button class="btn btn-sm btn-danger delete">Delete</button>
        </td>
      `;
      tableBody.appendChild(newRow);

      // Reset form
      form.reset();
    });

    // Edit and Delete actions
    tableBody.addEventListener("click", function(e) {
      if (e.target.classList.contains("delete")) {
        e.target.closest("tr").remove();
      }
      if (e.target.classList.contains("edit")) {
        let row = e.target.closest("tr");
        document.getElementById("name").value = row.cells[0].textContent;
        document.getElementById("email").value = row.cells[1].textContent;
        document.getElementById("phone").value = row.cells[2].textContent;
        document.getElementById("message").value = row.cells[3].textContent;
        row.remove();
      }
    });
  });
</script>

</body>
</html>
