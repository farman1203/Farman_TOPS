<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Feedback</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #86eef6d7, #9bebf9a8);
      margin: 0; padding: 0;
    }
    header {
      background: #02babd82;
      color: white; padding: 1rem;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    main {
      padding: 1rem;
      max-width: 1100px;
      margin: auto;
    }
    h1 {
      margin: 0;
    }
    /* Search Box */
    #searchBox {
      width: 100%; padding: 0.8rem;
      margin-bottom: 1rem;
      border: none; border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      font-size: 1rem;
    }
    /* Table Wrapper for Responsiveness */
    .table-wrapper {
      overflow-x: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    table {
      width: 100%; border-collapse: collapse;
      min-width: 600px; /* responsive scroll for small screens */
    }
    th, td {
      padding: 0.8rem; text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #093243c7; color: white;
      position: sticky; top: 0;
    }
    tr:hover {
      background: #f9f9f9;
      transition: 0.2s;
    }
    /* Buttons */
    button {
      background: #e63946;
      color: white; border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer; transition: 0.2s;
    }
    button:hover {
      background: #d62828;
      transform: scale(1.05);
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      color: #000000;
      text-decoration: none;
      font-weight: bold;
    }
    /* Responsive Breakpoints */
    @media (max-width: 768px) {
      body { font-size: 0.9rem; }
      th, td { padding: 0.6rem; }
      #searchBox { font-size: 0.9rem; }
    }
    @media (max-width: 480px) {
      header { font-size: 0.9rem; }
      button { font-size: 0.8rem; padding: 0.3rem 0.6rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📋 Feedback List</h1>
  </header>
  <main>
    <input type="text" id="searchBox" placeholder="Search by name or event...">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Event</th>
            <th>Rating</th>
            <th>Comments</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="feedbackTableBody"></tbody>
      </table>
    </div>
    <a href="index.html">⬅ Back to Form</a>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      function getFeedbacks() {
        return JSON.parse(localStorage.getItem("feedbacks")) || [];
      }
      function renderTable(filter = "") {
        const tbody = document.getElementById("feedbackTableBody");
        tbody.innerHTML = "";
        const feedbacks = getFeedbacks().filter(f =>
          f.name.toLowerCase().includes(filter.toLowerCase()) ||
          f.event.toLowerCase().includes(filter.toLowerCase())
        );
        if (feedbacks.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">No feedback found</td></tr>';
          return;
        }
        feedbacks.forEach((f, i) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${f.name}</td>
            <td>${f.email}</td>
            <td>${f.event}</td>
            <td>${f.rating}</td>
            <td>${f.comments}</td>
            <td><button onclick="deleteFeedback(${i})">Delete</button></td>
          `;
          tbody.appendChild(row);
        });
      }
      window.deleteFeedback = function(index) {
        let feedbacks = getFeedbacks();
        feedbacks.splice(index, 1);
        localStorage.setItem("feedbacks", JSON.stringify(feedbacks));
        renderTable(document.getElementById("searchBox").value);
      }
      document.getElementById("searchBox").addEventListener("input", e => {
        renderTable(e.target.value);
      });
      renderTable();
    });
  </script>
</body>
</html>
